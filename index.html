<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(주)배움 — 시연 허브</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  :root{
    --main:var(--baeron-main); --mid:var(--baeron-mid); --soft:var(--baeron-soft);
    --ink:#1d2433; --gray:#6b7280; --gray-light:#9aa3b2; --line:#e6e9f0;
    --bg:#f4f6fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{width:100%;max-width:760px;}
  .head{text-align:center;margin-bottom:26px;}
  .head .tag{display:inline-block;background:var(--soft);color:var(--main);font-size:11.5px;font-weight:800;border-radius:20px;padding:4px 14px;margin-bottom:10px;}
  .head h1{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .head .desc{font-size:13px;color:var(--gray);margin-top:8px;line-height:1.7;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s, transform .15s;box-shadow:0 2px 14px rgba(27,42,74,.06);}
  .card:hover{border-color:var(--main);transform:translateY(-2px);}
  .card .who{display:inline-block;font-size:10.5px;font-weight:800;border-radius:8px;padding:3px 9px;margin-bottom:10px;background:var(--soft);color:var(--main);}
  .card h2{font-size:16.5px;font-weight:800;margin-bottom:5px;}
  .card p{font-size:12px;color:var(--gray);line-height:1.65;}
  .card .go{display:inline-block;margin-top:12px;font-size:12px;font-weight:800;color:var(--main);}
  .foot{text-align:center;font-size:10.5px;color:var(--gray-light);margin-top:16px;line-height:1.7;}
  @media(max-width:640px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="tag">시연 허브</span>
    <h1>(주)배움 시스템 시연</h1>
    <div class="desc">진행 중인 개편 프로젝트 모음입니다. 화면 속 수치·문구는 예시이며, 방향성과 흐름 확인용입니다.</div>
  </div>

  <div class="cards">
    <a class="card" href="learning-plan/index.html">
      <span class="who">학습설계</span>
      <h2>학습설계 시스템</h2>
      <p>엑셀 표 방식을 구조화 데이터로 전환하는 학습설계 개편 시연 — 상담사 설계 툴, 설계보조도구, 학생 화면, 학습자 메뉴.</p>
      <span class="go">열기 →</span>
    </a>
    <a class="card" href="enrollment/index.html">
      <span class="who">수강신청</span>
      <h2>수강신청 개편</h2>
      <p>수강신청 화면 개편 시연 — 과정·방식·개강일 선택부터 패키지/단과 신청, 바구니, 결제 확인까지 풀 프레임 와이어프레임.</p>
      <span class="go">열기 →</span>
    </a>
  </div>

  <div class="foot">(주)배움 시스템팀</div>
</div>
</body>
</html>
